# platform-server CICD 集成凭据模板（P2）。
# 复制为真实值后 kubectl apply -n platform。
apiVersion: v1
kind: Secret
metadata:
  name: platform-server-cicd
  namespace: platform
type: Opaque
stringData:
  # Jenkins 用户 + API token（Jenkins 用户设置页生成）
  JENKINS_USER: "admin"
  JENKINS_TOKEN: "CHANGE_ME_JENKINS_API_TOKEN"
  # GitHub PAT（revert PR 需要 repo 写权限）
  GITHUB_TOKEN: "CHANGE_ME_GITHUB_PAT"
  # 与 delivery/platform-webhook secret 的值一致（Jenkinsfile Notify stage
  # 的 X-Platform-Webhook 头）
  PLATFORM_WEBHOOK_SECRET: "CHANGE_ME_SHARED_SECRET"
---
# Jenkins 侧：Notify platform stage 读取的共享 secret（同一值）。
apiVersion: v1
kind: Secret
metadata:
  name: platform-webhook
  namespace: delivery
type: Opaque
stringData:
  secret: "CHANGE_ME_SHARED_SECRET"
