# platform-server API 容器认证凭据模板。
# 复制为真实值后 kubectl apply -n platform（namespace 随部署环境）。
# database-url 指向 delivery 命名空间的 PostgreSQL release service。
apiVersion: v1
kind: Secret
metadata:
  name: platform-server-auth
  namespace: platform
type: Opaque
stringData:
  # 与 platform-postgresql-auth 的 password/database-url 保持一致
  database-url: "postgres://platform_user:CHANGE_ME@platform-postgresql-postgresql.delivery.svc:5432/platform_db?sslmode=disable"
  # openssl rand -hex 32
  jwt-secret: "CHANGE_ME_RANDOM_HEX"
