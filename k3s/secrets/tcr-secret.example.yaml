# Example Tencent Cloud TCR pull credentials.
#
# Create this secret in every namespace that needs to pull or inspect TCR
# images. Image Updater specifically reads the argocd/tcr-secret pull secret.
apiVersion: v1
kind: Secret
metadata:
  name: tcr-secret
  namespace: argocd
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ccr.ccs.tencentyun.com": {
          "username": "CHANGE_ME_TCR_USERNAME",
          "password": "CHANGE_ME_TCR_PASSWORD",
          "auth": "CHANGE_ME_BASE64_USERNAME_COLON_PASSWORD"
        }
      }
    }
