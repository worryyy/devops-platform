# Example Aliyun ACR pull credentials.
#
# Create this secret in every namespace that needs to pull or inspect ACR
# images. Image Updater specifically reads the argocd/tcr-secret pull secret.
# Use the VPC endpoint on Aliyun ECS nodes (same region); the public endpoint
# works too when off-cloud. The secret name keeps the historical tcr-secret.
apiVersion: v1
kind: Secret
metadata:
  name: tcr-secret
  namespace: argocd
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com": {
          "username": "CHANGE_ME_ACR_USERNAME",
          "password": "CHANGE_ME_ACR_PASSWORD",
          "auth": "CHANGE_ME_BASE64_USERNAME_COLON_PASSWORD"
        }
      }
    }
