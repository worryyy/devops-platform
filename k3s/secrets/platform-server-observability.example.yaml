# P3 可观测 Secrets 模板（真值不落库）。
# 应用到 platform ns；platform-server 经 envFromSecrets 读取。
#
# kubectl apply -f <填好真值的副本> -n platform
apiVersion: v1
kind: Secret
metadata:
  name: platform-server-observability
  namespace: platform
type: Opaque
stringData:
  # 飞书应用凭据（app 模式，首选）：建应用 → 开 im:message 发消息权限 →
  # 应用加进告警群。app 在且仅在一个群时 chat_id 可留空（自动发现）。
  FEISHU_APP_ID: "cli_xxxxxxxx"
  FEISHU_APP_SECRET: "xxxx"
  FEISHU_CHAT_ID: ""
  # 备选：群机器人 webhook 模式（app 凭据为空时生效）
  FEISHU_WEBHOOK_URL: ""
  # 机器人的签名密钥（开了签名校验才填）
  FEISHU_WEBHOOK_SECRET: ""
  # 告警卡片「查看」深链的前缀（平台对外地址）
  PLATFORM_PUBLIC_URL: "http://platform.100.115.204.94.nip.io"
  # Grafana 嵌入反代：服务账号 token（推荐，部署后创建）或 admin basic
  GRAFANA_URL: "http://grafana.platform.svc"
  GRAFANA_TOKEN: ""
  GRAFANA_USER: "admin"
  GRAFANA_PASSWORD: ""
