controller:
  serviceType: ClusterIP

  nodeSelector:
    platform-role: control

  # Port-forward is the primary access path; this internal URL keeps CLI and
  # webhook payloads consistent when reached inside the cluster.
  jenkinsUrl: http://jenkins.delivery.svc.cluster.local:8080

  jenkinsAdminEmail: ecampus-jenkins@users.noreply.github.com

  image:
    registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
    repository: pulseops/jenkins
    tag: "2.555.2-plugins-amd64"
    pullPolicy: IfNotPresent

  imagePullSecretName: tcr-secret

  # Plugins are baked into the image (built outside the cluster): the default
  # update center is unreachable from AliCloud and CN mirrors dropped the
  # update-center.json, so runtime plugin installation is disabled.
  installPlugins: []
  initializeOnce: true

  # The git-https pipeline credential is injected from this secret; the token
  # never lands in git or helm values. JCasC resolves ${git-credentials-token} from it.
  additionalExistingSecrets:
    - name: git-credentials
      keyName: token
    - name: acr-credentials
      keyName: username
    - name: acr-credentials
      keyName: password
    - name: platform-webhook
      keyName: secret
    - name: gitea-credentials
      keyName: username
    - name: gitea-credentials
      keyName: password

  # P2 platform integration: the pipeline's Notify platform stage posts the
  # stage summary here after every build (success or failure). Chart 5.9.x
  # does not render controller.additionalEnv, so the URL is a Jenkins global
  # env (JCasC globalNodeProperties); the secret rides the mounted secret.
  JCasC:
    defaultConfig: true
    configScripts:
      delivery-platform: |
        jenkins:
          globalNodeProperties:
            # envVars is the EnvironmentVariablesNodeProperty symbol; the
            # inner map carries the actual list. A wrong symbol here fails
            # ConfigurationAsCode.init and crash-loops the controller.
            - envVars:
                env:
                  - key: PLATFORM_WEBHOOK_URL
                    value: "http://platform-server-api.platform.svc/api/webhooks/jenkins"
      delivery-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: git-https
                      description: "GitHub token for the GitOps repository"
                      username: worryyy
                      password: ${file:/run/secrets/additional/git-credentials-token}
                  - usernamePassword:
                      scope: GLOBAL
                      id: acr-https
                      description: "Aliyun ACR credentials for cache existence checks"
                      username: ${file:/run/secrets/additional/acr-credentials-username}
                      password: ${file:/run/secrets/additional/acr-credentials-password}
                  - usernamePassword:
                      scope: GLOBAL
                      id: gitea-https
                      description: "In-cluster Gitea mirror (app-test)"
                      username: ${file:/run/secrets/additional/gitea-credentials-username}
                      password: ${file:/run/secrets/additional/gitea-credentials-password}

  # Keep the default in-cluster kubernetes cloud (service-account based);
  # the Jenkinsfile declares its agent pod template inline.
  agent:
    enabled: true
    podName: default
    showRawYaml: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

persistence:
  enabled: true
  size: 8Gi
