image:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/platform-server
  tag: dev
  pullPolicy: Always
  pullSecrets:
    - tcr-secret

webImage:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/platform-web
  tag: dev
  pullPolicy: Always

api:
  replicaCount: 1
  env:
    - name: LOG_LEVEL
      value: info
    # P3 weekly reports: the runner uploads through the same MinIO the
    # platform reads from (object store + presign).
    - name: MINIO_ENDPOINT
      value: platform-minio.platform.svc:9000
    - name: MINIO_ACCESS_KEY
      secretKeyRef:
        name: platform-minio-auth
        key: rootUser
    - name: MINIO_SECRET_KEY
      secretKeyRef:
        name: platform-minio-auth
        key: rootPassword
    # P4 数据管道：CH 日志检索 + 事件双写（addr/db/user 有默认值，密码走
    # clickhouse-admin Secret；未部署 CH 时 API 启动只告警降级不崩）。
    - name: CLICKHOUSE_ADDR
      value: platform-clickhouse.platform.svc.cluster.local:9000
    - name: CLICKHOUSE_DB
      value: platform
    - name: CLICKHOUSE_USER
      value: platform
    - name: CLICKHOUSE_PASSWORD
      secretKeyRef:
        name: clickhouse-admin
        key: password
  envFromSecrets:
    - platform-server-auth
    - platform-server-cicd
    - platform-server-observability
  nodeSelector:
    platform-role: light
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 1
  nodeSelector:
    platform-role: light

# host 用 control 节点 Tailscale IP 的 nip.io 域名（无公网入口时的
# 内部访问方案）；换环境时改这里。
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: platform.100.115.204.94.nip.io
  tls:
    enabled: false
    secretName: ""
