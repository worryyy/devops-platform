image:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/platform-server
  tag: dev
  pullPolicy: Always
  pullSecrets:
    - tcr-platform-secret

api:
  replicaCount: 1
  nodeSelector:
    platform-role: light
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
    secretName: ""
