# Experimental logging backend for the dev cluster: Monolithic single replica
# with filesystem storage and 7-day retention. Grafana positions this mode for
# testing/development and small installations; HA (multiple replicas or an
# object store) is intentionally out of scope.
deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-08-02"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

gateway:
  enabled: false

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    podSelector:
      app.kubernetes.io/name: alloy
  metrics:
    # Kubelet liveness/readiness probes originate from the cluster nodes.
    cidrs:
      - 100.67.223.96/32
      - 100.101.243.0/32
