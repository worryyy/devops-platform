version: v1

services:
  - name: academic
    displayName: Ecampus Academic
    owner: worryyy
    kind: go-service
    environments:
      - name: dev
        namespace: app
        branchPolicy: &mainBranch {defaultBranch: main, allowedBranches: [main]}
        git: {repo: https://github.com/worryyy/app-test.git, chartPath: k3s/charts/go-service, valuesFile: k3s/helm-values/workloads/ecampus-academic.yaml}
        image: {repository: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com/pulseops/ecampus-academic, tagPolicy: git-sha, requireDigest: true}
        jenkins: &jenkins {mode: webhook, jobName: ecampus-pipeline}
        argocd: {application: ecampus-academic, namespace: argocd}
        kubernetes: {namespace: app, rollout: ecampus-academic, service: ecampus-academic, container: ecampus-academic}
        health: &health {healthPath: /health, readyPath: /health}

  - name: agentchat
