# P3 可观测：Grafana（平台嵌入 + grafana.<domain> 直达）。
# 镜像经 ACR 转存（docker.io 拉取慢，沿用 redis/postgresql 先例）；
# tag 在转存时钉住（见 monitoring/dashboards/README.md 部署小节）。
image:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/grafana
  tag: "12.1.3"
  pullPolicy: IfNotPresent
  pullSecrets:
    - tcr-secret

# 平台域 /grafana 反代 + grafana.<domain> 直达共用同一实例：
# serve_from_sub_path 让 Grafana 原生服务 /grafana 路径空间，iframe 内的
# 跳转/资源引用不会逃出 /grafana。
grafana.ini:
  server:
    root_url: "%(protocol)s://%(domain)s/grafana"
    serve_from_sub_path: true
  security:
    allow_embedding: true
    disable_gravatar: true
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_plugin_updates: false
  users:
    auto_assign_org_role: Viewer

adminUser: admin
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        jsonData:
          timeInterval: 30s

# init 容器（download-dashboards）也走 ACR：docker.io 直拉在集群内
# 间歇超时。
downloadDashboardsImage:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/curl
  tag: "8.9.1"
  pullPolicy: IfNotPresent

# 大盘定义在 grafana-dashboards.yaml（由 sync-dashboards.sh 生成，源文件
# monitoring/dashboards/*.json）。

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - grafana.100.115.204.94.nip.io
  path: /

persistence:
  type: pvc
  enabled: true
  storageClassName: local-path
  size: 2Gi

nodeSelector:
  platform-role: worker

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

# PVC 数据目录归 grafana(472)；local-path 上 root chown 间歇被拒，
# 且 grafana 自身可写，无需重置属主。
initChownData:
  enabled: false
