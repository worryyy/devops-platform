# P1 平台骨架：单实例 Redis（会话/缓存/轻量队列），无持久化。
# chart 已 vendor 进 app-test（k3s/charts/vendor/redis）。
global:
  security:
    # chart 默认镜像在 docker.io/bitnami/*（经 1ms.run mirror 拉取）
    allowInsecureImages: true
  imagePullSecrets:
    - tcr-secret

architecture: standalone

image:
  # 经 ACR 中转（docker.1ms.run 对该镜像拉取极慢；直接 Docker Hub 节点又
  # 不通）——Mac pull -> push ACR 一次性中转，chart 指向 ACR。
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/redis
  tag: "8.2.1-amd64"

master:
  persistence:
    enabled: false
  nodeSelector:
    platform-role: light
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

auth:
  enabled: false

replica:
  replicaCount: 0

metrics:
  enabled: false
