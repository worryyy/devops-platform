{{- if .Values.rollout.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "goService.ingressName" . }}
  labels:
    {{- include "goService.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.rollout.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
spec:
  ingressClassName: {{ .Values.rollout.ingress.className | quote }}
  rules:
    - {{- if .Values.rollout.ingress.host }}
      host: {{ .Values.rollout.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- $paths := .Values.rollout.ingress.paths }}
          {{- if not $paths }}
          {{- $paths = list .Values.rollout.ingress.path }}
          {{- end }}
          {{- range $path := $paths }}
          - path: {{ $path | quote }}
            pathType: {{ $.Values.rollout.ingress.pathType }}
            backend:
              service:
                name: {{ include "goService.stableServiceName" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
