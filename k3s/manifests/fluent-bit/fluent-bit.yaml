# P4 采集层：Fluent Bit DaemonSet（独立 manifest，不经 helm chart）。
# 链路：tail /var/log/containers/*.log（k3s containerd CRI 格式）
#   -> kubernetes filter（注入 pod/namespace/container + Merge_Log 提升业务
#      slog JSON 字段 ts/level/service/route/trace_id/deploy_id/msg 到顶层）
#   -> Kafka topic logs.raw（key=service，FORMAT json 整条记录重序列化）
# ClickHouse 侧由 logs_mv 物化视图用 JSON* 函数抽取（见
# monitoring/pipeline/clickhouse/001_logs.sql）。解析失败的行在 CH 侧落
# service=unparsed 兜底。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: platform
  labels:
    app.kubernetes.io/name: fluent-bit
imagePullSecrets:
  - name: tcr-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: platform
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Grace         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On
        storage.path  /tmp/buffer
        storage.sync  normal
        storage.checksum off
        storage.backlog.mem_limit 100M

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      *fluent-bit*,*clickhouse-*,*kube-system_*
        Parser            cri
        DB                /tmp/buffer/tail.db
        Mem_Buf_Limit     100MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    # Pod 元数据注入 + 业务 slog JSON 提升到记录顶层。
    # Kube_Tag_Prefix 必须吃掉 tail tag 的路径段（kube.var.log.containers.），
    # 否则 filter 的 <pod>_<ns>_<container> 正则解析失败、元数据全空（踩坑）。
    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Kube_Tag_Prefix       kube.var.log.containers.
        Merge_Log             On
        Keep_Log              Off
        K8S-Logging.Parser    On
        K8S-Logging.Exclude   Off
        Labels                Off
        Annotations           Off

    [OUTPUT]
        Name              kafka
        Match             kube.*
        Brokers           platform-kafka.platform.svc.cluster.local:9092
        Topics            logs.raw
        Format            json
        message_key       service
        Retry_Limit       3
        # librdkafka 透传（required_acks 等老键已废，acks 走 rdkafka.*）
        rdkafka.acks      all

  parsers.conf: |
    # k3s containerd CRI 行格式：`<time> <stream> <F|P> <payload>`
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<flags>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   Off
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: platform
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      # 采集所有节点（含 control 节点上的 kafka/clickhouse 自身日志）
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: fluent-bit
          # 经 ACR 中转（fluent/fluent-bit:3.2.10）
          image: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com/pulseops/fluent-bit:3.2.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 150Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: buffer
              mountPath: /tmp/buffer
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: buffer
          emptyDir: {}
