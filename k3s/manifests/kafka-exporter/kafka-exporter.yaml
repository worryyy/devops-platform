# P4 管道指标：kafka-exporter（danielqsj，经 ACR 中转 v1.9.0）——
# consumer group lag 暴露为 Prometheus 指标（kafka_consumergroup_lag）。
# A5 验收（24h lag <1 万条）与 P6 巡检检查器 kafka_lag 的数据源。
# 部署 platform ns，nodeSelector light；Prometheus 抓取经
# prometheus values 的 additionalServiceMonitors 接入（见 test-observability.sh 断言）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: platform
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
    spec:
      imagePullSecrets:
        - name: tcr-secret
      nodeSelector:
        platform-role: light
      containers:
        - name: kafka-exporter
          image: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com/pulseops/kafka-exporter:v1.9.0
          imagePullPolicy: IfNotPresent
          args:
            - --kafka.server=platform-kafka.platform.svc.cluster.local:9092
            # v1.9.0 的 flag 带点；正则用 [.] 避免反斜杠在多层转义中丢失；
            # --log.enable-sarama=false 在该 build 解析报错，勿加
            - --topic.filter=^logs[.]raw$
            - --group.filter=^platform-sinker$
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: platform
  labels:
    app.kubernetes.io/name: kafka-exporter
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
