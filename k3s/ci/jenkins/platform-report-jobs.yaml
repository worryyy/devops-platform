# P3: platform-server 创建周报 runner Job（batch/jobs，platform ns）。
# 复用 platform-server SA；仅授予 Job/Pod 读建权限，最小面。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-report-jobs
  namespace: platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-server-report-jobs
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: platform-server
    namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-report-jobs
