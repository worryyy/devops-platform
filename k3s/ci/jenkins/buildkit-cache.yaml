apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: delivery
data:
  buildkitd.toml: |
    [worker.oci]
      gc = true
      reservedSpace = "5GB"
      maxUsedSpace = "25GB"
      minFreeSpace = "5GB"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: delivery
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
