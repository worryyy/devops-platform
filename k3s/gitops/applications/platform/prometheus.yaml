apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: platform-addons

  sources:
    # chart 已 vendor 进 app-test（k3s/charts/vendor/prometheus）——远端
    # chart 仓库的 helm pull 在 repo-server 内间歇超时。
    - repoURL: http://gitea-http.delivery.svc.cluster.local:3000/gitea_admin/app-test.git
      targetRevision: main
      path: k3s/charts/vendor/prometheus
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/k3s/helm-values/platform/prometheus.yaml
    - repoURL: http://gitea-http.delivery.svc.cluster.local:3000/gitea_admin/app-test.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
