apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: platform-addons

  sources:
    # bitnami chart 仓库 index 达 27MB，repo-server 拉取超时——chart 直接
    # vendor 进 app-test（与 go-service 同模式），不再引用远端仓库。
    - repoURL: http://gitea-http.delivery.svc.cluster.local:3000/gitea_admin/app-test.git
      targetRevision: main
      path: k3s/charts/vendor/redis
      helm:
        releaseName: platform-redis
        valueFiles:
          - $values/k3s/helm-values/platform/redis.yaml
    - repoURL: http://gitea-http.delivery.svc.cluster.local:3000/gitea_admin/app-test.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
