apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecampus-topic
  namespace: argocd
spec:
  project: workloads

  source:
    repoURL: https://github.com/worryyy/devops-test.git
    targetRevision: main
    path: k3s/charts/go-service
    helm:
      releaseName: ecampus-topic
      valueFiles:
        - ../../helm-values/workloads/ecampus-topic.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

