version: v1

releaseProfiles:
  critical-canary:
    strategy: canary
    waitTimeout: 75m
    manualPromotion: false
    scaleDownDelaySeconds: 900
    analysis:
      enabled: true
      interval: 1m
      count: 10
      consecutiveSuccessLimit: 2
      failureLimit: 2
      inconclusiveLimit: 10
      consecutiveErrorLimit: 2
      minSamples: 3000
      stableMinSamples: 3000
      maxErrorRate: 0.01
      maxErrorRateIncrease: 0.003
      maxP95Ratio: 1.2
      minOperationSuccessRate: 0.99
      inconclusiveTimeout: 15m
  standard-canary:
    strategy: canary
    waitTimeout: 30m
    manualPromotion: false
    scaleDownDelaySeconds: 900
    analysis:
      enabled: true
      interval: 1m
      count: 7
      consecutiveSuccessLimit: 2
      failureLimit: 2
      inconclusiveLimit: 7
      consecutiveErrorLimit: 2
      minSamples: 1000
      stableMinSamples: 1000
      maxErrorRate: 0.02
      maxErrorRateIncrease: 0.01
      maxP95Ratio: 1.5
      inconclusiveTimeout: 0s
  controlled-bluegreen:
    strategy: bluegreen
    waitTimeout: 45m
    manualPromotion: true
    previewReplicaCount: 2
    promotionTimeout: 10m
    scaleDownDelaySeconds: 900
    analysis:
      enabled: true
      interval: 1m
      count: 10
      consecutiveSuccessLimit: 2
      failureLimit: 2
      inconclusiveLimit: 2
      consecutiveErrorLimit: 2
      minSamples: 1000
      stableMinSamples: 1000
      maxErrorRate: 0.01
      maxErrorRateIncrease: 0.005
      maxP95Ratio: 1.3
  fast-rolling:
    strategy: rolling
    waitTimeout: 15m
    manualPromotion: false
    analysis:
      enabled: false

environmentOverrides:
  dev:
    profiles:
      critical-canary:
        analysis: {minSamples: 50, stableMinSamples: 50}
      standard-canary:
        analysis: {minSamples: 20, stableMinSamples: 20}
      controlled-bluegreen:
        analysis: {minSamples: 20, stableMinSamples: 20}

services:
  - name: academic
    displayName: Ecampus Academic
    owner: worryyy
    kind: go-service
    rolloutProfile: standard-canary
    sli: {requestRouteRegex: '^/api/academic.*$', maxP95Seconds: 0.8}
    environments:
      - name: dev
        namespace: app
        branchPolicy: &mainBranch {defaultBranch: main, allowedBranches: [main]}
        git: {repo: https://github.com/worryyy/app-test.git, chartPath: k3s/charts/go-service, valuesFile: k3s/helm-values/workloads/ecampus-academic.yaml}
        image: {repository: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com/pulseops/ecampus-academic, tagPolicy: git-sha, requireDigest: true}
        jenkins: &jenkins {mode: webhook, jobName: ecampus-pipeline}
        argocd: {application: ecampus-academic, namespace: argocd}
        kubernetes: {namespace: app, rollout: ecampus-academic, service: ecampus-academic, container: ecampus-academic}
        health: &health {healthPath: /health, readyPath: /health}

  - name: agentchat
    displayName: Ecampus Agent Chat
    owner: worryyy
    kind: go-service
    rolloutProfile: controlled-bluegreen
    sli: {requestRouteRegex: '^/api/agent.*$', maxP95Seconds: 1.5}
    manualPromotion: true
    previewProbes:
      - {name: health, path: /health, method: GET}
      - {name: conversations, path: /api/agent/conversation, method: GET, requiresAuth: true}
    environments:
      - name: dev
        namespace: app
        branchPolicy: *mainBranch
        git: {repo: https://github.com/worryyy/app-test.git, chartPath: k3s/charts/go-service, valuesFile: k3s/helm-values/workloads/ecampus-agentchat.yaml}
        image: {repository: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com/pulseops/ecampus-agentchat, tagPolicy: git-sha, requireDigest: true}
        jenkins: *jenkins
        argocd: {application: ecampus-agentchat, namespace: argocd}
        kubernetes: {namespace: app, rollout: ecampus-agentchat, service: ecampus-agentchat, container: ecampus-agentchat}
        health: *health

