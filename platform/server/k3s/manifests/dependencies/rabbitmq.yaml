# ecampus 业务依赖：RabbitMQ（官方镜像，bitnami chart 的 init 脚本与官方
# 镜像不兼容，故用原生 StatefulSet）。凭据与应用 dev 配置对齐
#（amqp://campus:...@rabbitmq:5672）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: app
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        platform-role: worker
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: mgmt
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: campus
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 8
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: app
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: mgmt
      port: 15672
      targetPort: mgmt
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: app
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
