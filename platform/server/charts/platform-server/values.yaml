image:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/platform-server
  tag: dev
  pullPolicy: Always
  pullSecrets:
    - tcr-platform-secret

webImage:
  registry: crpi-gfwwpdquc14b7w22.cn-shanghai.personal.cr.aliyuncs.com
  repository: pulseops/platform-web
  tag: dev
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

api:
  replicaCount: 1
  command: []
  args:
    - api
  # 非敏感 env（如 LOG_LEVEL）；DATABASE_URL/JWT_SECRET 走 envFromSecrets
  # （platform-server-auth），不落 values。
  env: []
  envFromSecrets: []
  nodeSelector:
    platform-role: light
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

web:
  replicaCount: 1
  nodeSelector:
    platform-role: light
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ""
  tls:
    enabled: false
    secretName: ""

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

podAnnotations: {}
podLabels:
  app-role: platform

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

tolerations: []
affinity: {}
